name: Build & Deploy Sprint Pocket

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: sprint-pocket-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ci-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO_DIR=/srv/sprint-pocket
            ENV_FILE=/srv/secret-envs/sprint-pocket.env

            # Uses the per-repo SSH host alias defined in ~/.ssh/config on the
            # server, so the dedicated sprint-pocket deploy key is used.
            REPO_URL=git@github-sprint-pocket:${{ github.repository }}.git

            # Trust github.com host key so non-interactive clone/fetch works.
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Primera vez: clonando repo..."
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch --all
            git reset --hard "origin/${{ github.ref_name }}"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing production env file: $ENV_FILE"
              exit 1
            fi

            # Single root .env consumed by Docker Compose and the containers.
            cp --remove-destination "$ENV_FILE" "$REPO_DIR/.env"

            echo "Levantando stack de produccion (db + redis + api + web)..."
            GITHUB_SHA=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d --build --pull always --force-recreate --remove-orphans

            echo "Estado de los servicios:"
            docker compose -f docker-compose.prod.yml ps

            echo "Logs recientes:"
            docker compose -f docker-compose.prod.yml logs --tail=40 api
            docker compose -f docker-compose.prod.yml logs --tail=40 web

            # Libera espacio de imagenes/capas viejas.
            docker image prune -f
