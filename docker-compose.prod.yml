services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sprint-poker-api:${GITHUB_SHA:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: sh -c "pnpm --filter @sprint/api db:migrate && pnpm --filter @sprint/api start:prod"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_default

      traefik.http.routers.sprint-poker-api.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.sprint-poker-api.entrypoints: websecure
      traefik.http.routers.sprint-poker-api.tls.certresolver: le
      traefik.http.routers.sprint-poker-api.service: sprint-poker-api

      traefik.http.routers.sprint-poker-api-http.rule: Host(`${API_DOMAIN}`)
      traefik.http.routers.sprint-poker-api-http.entrypoints: web
      traefik.http.routers.sprint-poker-api-http.middlewares: sprint-poker-api-redirect

      traefik.http.middlewares.sprint-poker-api-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.sprint-poker-api-redirect.redirectscheme.permanent: "true"

      traefik.http.services.sprint-poker-api.loadbalancer.server.port: "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sprint-poker-web:${GITHUB_SHA:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - api
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_default

      traefik.http.routers.sprint-poker-web.rule: Host(`${WEB_DOMAIN}`)
      traefik.http.routers.sprint-poker-web.entrypoints: websecure
      traefik.http.routers.sprint-poker-web.tls.certresolver: le
      traefik.http.routers.sprint-poker-web.service: sprint-poker-web

      traefik.http.routers.sprint-poker-web-www.rule: Host(`www.${WEB_DOMAIN}`)
      traefik.http.routers.sprint-poker-web-www.entrypoints: websecure
      traefik.http.routers.sprint-poker-web-www.tls.certresolver: le
      traefik.http.routers.sprint-poker-web-www.service: sprint-poker-web

      traefik.http.routers.sprint-poker-web-http.rule: Host(`${WEB_DOMAIN}`) || Host(`www.${WEB_DOMAIN}`)
      traefik.http.routers.sprint-poker-web-http.entrypoints: web
      traefik.http.routers.sprint-poker-web-http.middlewares: sprint-poker-web-redirect

      traefik.http.middlewares.sprint-poker-web-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.sprint-poker-web-redirect.redirectscheme.permanent: "true"

      traefik.http.services.sprint-poker-web.loadbalancer.server.port: "3000"

volumes:
  pgdata:
  redisdata:

networks:
  web:
    external: true
    name: traefik_default
  internal:
    driver: bridge
